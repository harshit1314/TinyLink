<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>TinyLink - Stats</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 min-h-screen">
    <header class="bg-white shadow">
      <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
        <h1 class="text-xl font-semibold">TinyLink</h1>
        <nav>
          <a href="/" class="text-sm text-gray-600">Dashboard</a>
        </nav>
      </div>
    </header>
    <main class="max-w-3xl mx-auto p-4">
      <section class="bg-white p-4 rounded shadow mb-4">
        <h2 class="text-lg font-medium mb-2">Link Stats</h2>
        <div id="content" class="min-h-[120px] flex items-center justify-center text-gray-500">Loading...</div>
      </section>
    </main>

    <script>
      const code = window.location.pathname.split('/').pop();
      const el = document.getElementById('content');
      async function load() {
        el.classList.remove('text-red-600');
        el.classList.add('text-gray-500');
        el.innerHTML = 'Loading...';
        try {
          const res = await fetch(`/api/links/${code}`);
          if (res.status === 200) {
            const d = await res.json();
            el.classList.remove('text-gray-500');
            el.innerHTML = `
              <div class="space-y-2">
                <p><strong>Code:</strong> <span class="font-mono bg-gray-100 px-2 py-1 rounded">${d.code}</span></p>
                <p><strong>Target:</strong> <a href="${d.url}" target="_blank" class="text-blue-600 break-words">${d.url}</a></p>
                <p><strong>Clicks:</strong> ${d.clicks}</p>
                <p><strong>Created:</strong> ${d.created_at}</p>
                <p><strong>Last clicked:</strong> ${d.last_clicked || '-'}</p>
                <div class="mt-4 flex gap-3">
                  <button id="copyBtn" class="px-3 py-1 border rounded text-sm">Copy Link</button>
                  <button id="delBtn" class="px-3 py-1 bg-red-600 text-white rounded text-sm">Delete</button>
                </div>
              </div>
            `;
            document.getElementById('copyBtn').addEventListener('click', async ()=>{
              await navigator.clipboard.writeText(`${location.origin}/${d.code}`).catch(()=>{});
              alert('Copied to clipboard');
            });
            document.getElementById('delBtn').addEventListener('click', async () => {
              if (!confirm('Delete link?')) return;
              const r = await fetch(`/api/links/${d.code}`, { method: 'DELETE' });
              if (r.ok) { alert('Deleted'); window.location.href = '/'; }
            });
          } else if (res.status === 404) {
            el.classList.add('text-red-600');
            el.innerHTML = 'Not found';
          } else {
            el.classList.add('text-red-600');
            el.innerHTML = 'Error fetching data';
          }
        } catch (e) {
          el.classList.add('text-red-600');
          el.innerHTML = 'Network error';
        }
      }
      load();
    </script>
  </body>
</html>

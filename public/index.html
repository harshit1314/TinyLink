<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>TinyLink - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 min-h-screen">
    <header class="bg-white shadow">
      <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
        <h1 class="text-xl font-semibold">TinyLink</h1>
        <nav>
          <a href="/" class="text-sm text-gray-600">Dashboard</a>
        </nav>
      </div>
    </header>
    <main class="max-w-5xl mx-auto p-4">
      <section class="bg-white p-4 rounded shadow mb-4">
        <h2 class="text-lg font-medium mb-2">Create Short Link</h2>
        <form id="createForm" class="space-y-3">
          <div>
            <label class="block text-sm font-medium text-gray-700">Target URL</label>
            <input id="url" type="url" placeholder="https://example.com/very/long/path" class="mt-1 block w-full border-gray-300 rounded p-2" required />
            <p id="urlErr" class="text-red-600 text-sm mt-1 hidden">Please enter a valid URL (http/https).</p>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700">Custom Code (optional, 6-8 alphanumeric)</label>
            <input id="code" type="text" placeholder="e.g. docs123" class="mt-1 block w-full border-gray-300 rounded p-2" />
            <p id="codeErr" class="text-red-600 text-sm mt-1 hidden">Code must be 6-8 alphanumeric characters.</p>
          </div>
          <div class="flex items-center gap-3">
            <button id="createBtn" class="bg-blue-600 disabled:opacity-50 text-white px-4 py-2 rounded">Create</button>
            <span id="msg" class="ml-3 text-sm text-green-600"></span>
          </div>
        </form>
      </section>

      <section class="bg-white p-4 rounded shadow">
        <div class="flex items-center justify-between mb-3">
          <h2 class="text-lg font-medium">Links</h2>
          <div class="flex gap-2 items-center">
            <input id="search" type="search" placeholder="Search code or URL" class="border rounded p-2 text-sm" />
            <select id="sort" class="border rounded p-2 text-sm">
              <option value="created">Newest</option>
              <option value="clicks">Most clicked</option>
            </select>
          </div>
        </div>
        <div id="empty" class="text-gray-500 p-6 text-center hidden">No links yet — create one above.</div>
        <div id="tableWrap" class="overflow-x-auto">
          <table class="min-w-full text-sm">
            <thead>
              <tr class="text-left text-gray-600">
                <th class="py-2">Code</th>
                <th class="w-1/2">Target URL</th>
                <th>Clicks</th>
                <th>Last Clicked</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="links"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script>
      const form = document.getElementById('createForm');
      const urlInput = document.getElementById('url');
      const codeInput = document.getElementById('code');
      const createBtn = document.getElementById('createBtn');
      const msg = document.getElementById('msg');
      const urlErr = document.getElementById('urlErr');
      const codeErr = document.getElementById('codeErr');
      const search = document.getElementById('search');
      const sort = document.getElementById('sort');
      const empty = document.getElementById('empty');

      let cached = [];

      function truncate(text, n = 80) {
        return text.length > n ? text.slice(0, n-1) + '…' : text;
      }

      function renderLinks(list) {
        const tbody = document.getElementById('links');
        tbody.innerHTML = '';
        if (!list.length) {
          empty.classList.remove('hidden');
        } else {
          empty.classList.add('hidden');
        }
        for (const l of list) {
          const tr = document.createElement('tr');
          const short = `${location.origin}/${l.code}`;
          tr.innerHTML = `
            <td class="py-2 font-medium"><a class="text-blue-600" href="/${l.code}" target="_blank">${l.code}</a></td>
            <td class="w-1/2 max-w-xl"><div class="truncate max-w-full" title="${l.url}">${truncate(l.url, 120)}</div></td>
            <td>${l.clicks}</td>
            <td>${l.last_clicked || '-'}</td>
            <td>
              <a class="text-sm text-indigo-600 mr-2" href="/code/${l.code}">Stats</a>
              <button data-code="${l.code}" data-short="${short}" class="copyBtn text-sm text-gray-700 mr-2">Copy</button>
              <button data-code="${l.code}" class="delBtn text-sm text-red-600">Delete</button>
            </td>
          `;
          tbody.appendChild(tr);
        }
        document.querySelectorAll('.delBtn').forEach(b => b.addEventListener('click', async (e) => {
          const code = e.target.dataset.code;
          if (!confirm(`Delete ${code}?`)) return;
          const r = await fetch(`/api/links/${code}`, { method: 'DELETE' });
          if (r.ok) loadLinks();
        }));
        document.querySelectorAll('.copyBtn').forEach(b => b.addEventListener('click', async (e) => {
          const short = e.target.dataset.short;
          await navigator.clipboard.writeText(short).catch(()=>{});
          const old = msg.textContent;
          msg.textContent = 'Copied!';
          setTimeout(()=> msg.textContent = old, 1500);
        }));
      }

      async function loadLinks() {
        const res = await fetch('/api/links');
        const data = await res.json();
        cached = data;
        applyFilterSort();
      }

      function applyFilterSort() {
        const q = search.value.trim().toLowerCase();
        let list = cached.slice();
        if (q) {
          list = list.filter(l => l.code.toLowerCase().includes(q) || l.url.toLowerCase().includes(q));
        }
        if (sort.value === 'clicks') list.sort((a,b)=> (b.clicks||0) - (a.clicks||0));
        else list.sort((a,b)=> new Date(b.created_at) - new Date(a.created_at));
        renderLinks(list);
      }

      form.addEventListener('submit', async (ev) => {
        ev.preventDefault();
        // client-side validation
        urlErr.classList.add('hidden');
        codeErr.classList.add('hidden');
        const urlVal = urlInput.value.trim();
        const codeVal = codeInput.value.trim();
        const urlOk = /^https?:\/\/.+/.test(urlVal);
        if (!urlOk) { urlErr.classList.remove('hidden'); return; }
        if (codeVal && !/^[A-Za-z0-9]{6,8}$/.test(codeVal)) { codeErr.classList.remove('hidden'); return; }

        createBtn.disabled = true;
        const oldMsg = msg.textContent;
        msg.textContent = 'Creating...';
        const body = { url: urlVal };
        if (codeVal) body.code = codeVal;
        const res = await fetch('/api/links', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        if (res.status === 201) {
          const data = await res.json();
          msg.textContent = `Created ${data.code}`;
          urlInput.value = '';
          codeInput.value = '';
          loadLinks();
        } else if (res.status === 409) {
          const err = await res.json().catch(()=>({ error: 'Conflict' }));
          msg.textContent = err.error || 'Code exists';
        } else {
          const err = await res.json().catch(() => ({ error: 'Unknown error' }));
          msg.textContent = err.error || 'Error';
        }
        createBtn.disabled = false;
        setTimeout(()=> msg.textContent = '', 2500);
      });

      search.addEventListener('input', applyFilterSort);
      sort.addEventListener('change', applyFilterSort);

      loadLinks();
    </script>
  </body>
</html>
